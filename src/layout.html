<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#161616">
  <link rel="canonical" href="{{site}}{{path}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Körper Bodensysteme">
  <meta property="og:locale" content="de_DE">
  <meta property="og:url" content="{{site}}{{path}}">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{site}}{{og_card}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_title}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="geo.region" content="DE-RP">
  <meta name="geo.placename" content="Merxheim">
  <link rel="alternate" type="text/markdown" href="/llms.txt" title="Kurzfassung für KI-Assistenten">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <link rel="icon" href="/assets/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="image" href="{{og_image}}">
  <link rel="stylesheet" href="/assets/css/fonts.css?v={{version}}">
  <link rel="stylesheet" href="/assets/css/style.css?v={{version}}">
  <link rel="stylesheet" href="/assets/css/theme.css?v={{version}}">
{{schema}}
</head>
<body class="{{body_class}}">
  <a class="skip" href="#main">Zum Inhalt springen</a>
{{header}}
  <main id="main">
{{content}}
  </main>
{{footer}}
  <div class="mobile-cta" data-mobile-cta>
    <a href="tel:+4967546903950" class="btn btn-ghost-dark">Anrufen</a>
    <a href="{{cta_href}}" class="btn btn-orange">Projekt anfragen</a>
  </div>
{{cookie}}
  <script src="/assets/js/main.js?v={{version}}" defer></script>
</body>
</html>
