    <!-- ============ SYSTEM ============ -->
    <section class="sp-system" aria-labelledby="sys-title">
      <div class="wrap sp-system-grid">
        <div class="sp-system-copy">
          <p class="eyebrow">Im System</p>
          <h2 id="sys-title" class="h2">Teil eines Ganzen</h2>
          <p class="lead">{{layer_note}}</p>
          <a class="btn btn-ghost" href="/#aufbau">Zum Systemaufbau <span class="arr" aria-hidden="true">→</span></a>
        </div>
        <div class="sp-system-stage">
          <svg class="slab" viewBox="0 0 660 470" role="img" aria-label="Querschnitt des Bodenaufbaus mit hervorgehobener Schicht" data-slab data-layers="{{layers}}"></svg>
        </div>
      </div>
    </section>
